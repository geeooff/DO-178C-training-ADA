# =============================================================================
#  Intégration continue — une seule vérité sur l'environnement
#
#  Le dépôt frère en C++ a cinq jobs qui installent chacun leur chaîne avec
#  apt. Ici, un seul job, qui construit l'image du SECI et lance la
#  vérification **dedans**.
#
#  Pourquoi ce choix. Le §11.15 demande que l'environnement de construction
#  soit identifié et maîtrisé. Si le workflow réinstallait GNAT de son côté,
#  le dépôt aurait deux descriptions de son environnement — celle du
#  Dockerfile et celle du YAML — qui divergeraient au premier oubli. Une
#  seule source, et la CI vérifie précisément ce que le développeur exécute
#  sur son poste.
#
#  Le prix payé : la construction de l'image dure environ deux minutes à
#  froid. Le cache GitHub Actions la ramène à quelques secondes tant que le
#  Dockerfile ne change pas — et quand il change, c'est justement qu'il faut
#  la reconstruire.
#
#  RÉSERVE : `ubuntu-26.04` est une image de runner en PRÉVERSION chez GitHub.
#  Une image beta peut évoluer sans préavis, ce qu'un SECI cherche à éviter.
#  L'exposition est ici minime — le runner ne fournit que Docker, toute la
#  chaîne Ada venant de l'image épinglée.
#
#  ACTIONS ÉPINGLÉES PAR SHA, PAS PAR ÉTIQUETTE
#  --------------------------------------------
#  `actions/checkout@v7` est une étiquette MOUVANTE : GitHub la déplace à
#  chaque correctif. C'est le même défaut que `ubuntu-latest`, et le dépôt ne
#  peut pas le reprocher à l'un en le tolérant chez l'autre. Chaque action est
#  donc figée sur un SHA de commit, avec sa version en commentaire — la forme
#  que Dependabot sait mettre à jour.
#
#  Une étiquette peut être reposée sur un autre commit par le propriétaire du
#  dépôt d'action, ou par quelqu'un qui en aurait pris le contrôle. Un SHA,
#  non. Sur un projet réel, c'est la différence entre « on utilise checkout
#  v7 » et « on sait exactement quel code a tourné ».
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Vérification dans le SECI
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          #  git describe a besoin de l'historique complet : config_index.py
          #  s'en sert pour identifier la baseline dans le SCI.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Construire le SECI
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .devcontainer
          load: true
          tags: do178c-ada:verif
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Identifier l'environnement de production fait partie des données de
      # vie : le journal de la CI doit dire avec quoi le résultat a été
      # obtenu, sans avoir à ouvrir le Dockerfile.
      - name: Identifier l'environnement
        run: |
          docker run --rm do178c-ada:verif bash -lc '
            . /etc/os-release && echo "Système    : $PRETTY_NAME $(uname -m)"
            echo "gnatmake   : $(gnatmake --version | head -1)"
            echo "gprbuild   : $(gprbuild --version | head -1)"
            echo "gnatprove  : $(gnatprove --version | head -1)"
            echo "gnatcov    : $(gnatcov --version | head -1)"
            echo "gnatformat : $(gnatformat --version | head -1)"'

      # --user : le dépôt appartient à l'utilisateur du runner (uid 1001) et
      # non à l'utilisateur `ubuntu` de l'image (uid 1000). Sans cette option,
      # gprbuild ne peut pas créer obj/. HOME doit suivre, sinon les outils
      # cherchent un répertoire personnel qui n'existe pas.
      - name: Vérifier — compilation, exécution, preuve, formatage
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            do178c-ada:verif ./scripts/verify.sh

      - name: Mesurer la couverture (statements, décisions, MC/DC)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            do178c-ada:verif ./scripts/coverage.sh

      # Le SCI et le SECI sont des données de vie CC1 : ils ne sont pas
      # versionnés — ils sont REGÉNÉRÉS depuis l'état exact du dépôt, sinon
      # ils se périment en silence. fetch-depth: 0 plus haut est nécessaire à
      # `git describe`, dont l'outil se sert pour identifier la baseline.
      - name: Produire le SCI et le SECI
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            do178c-ada:verif bash -lc '
              git config --global --add safe.directory /workspace
              python3 tools/config_index.py'

      - name: Archiver les données de vie
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: donnees-de-vie
          path: |
            reports/SCI.md
            reports/SECI.md
            reports/tracabilite.csv
          if-no-files-found: ignore
          retention-days: 90

      - name: Archiver les rapports de couverture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapport-couverture
          path: reports/couverture/
          if-no-files-found: ignore
          retention-days: 30
