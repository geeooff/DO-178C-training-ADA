# =============================================================================
#  Intégration continue — une seule vérité sur l'environnement
#
#  Le dépôt frère en C++ a cinq jobs qui installent chacun leur chaîne avec
#  apt. Ici, un seul job, qui construit l'image du SECI et lance la
#  vérification **dedans**.
#
#  Pourquoi ce choix. Le §11.15 demande que l'environnement de construction
#  soit identifié et maîtrisé. Si le workflow réinstallait GNAT de son côté,
#  le dépôt aurait deux descriptions de son environnement — celle du
#  Dockerfile et celle du YAML — qui divergeraient au premier oubli. Une
#  seule source, et la CI vérifie précisément ce que le développeur exécute
#  sur son poste.
#
#  Le prix payé : la construction de l'image dure de quatre à huit minutes à
#  froid. Le cache GitHub Actions la ramène à environ 70 et 83 secondes —
#  mesuré les 28 et 31 août, sept couches réutilisées — mais à trois
#  conditions :
#    - ni le Dockerfile ni l'image de base n'ont changé ;
#    - une exécution a eu lieu dans les sept jours, car GitHub évince au-delà
#      toute entrée de cache non consultée ;
#    - la construction part de main, ou d'une branche qui a déjà construit,
#      car une branche ne lit que son propre cache et celui de main.
#  Au rythme de ce dépôt, la plupart des constructions sont donc à froid. Le
#  cache est une commodité : rien dans la vérification n'en dépend.
#
#  RÉSERVE : `ubuntu-26.04` était une image de runner en préversion chez
#  GitHub à la création de ce dépôt (août 2026) ; elle est en disponibilité
#  générale depuis. La réserve de fond demeure : une image de runner évolue
#  à chaque mise à jour, sans épinglage possible, ce qu'un SECI cherche à
#  éviter. L'exposition est ici minime — le runner ne fournit que Docker,
#  toute la chaîne Ada venant de l'image épinglée.
#
#  ACTIONS ÉPINGLÉES PAR SHA, PAS PAR ÉTIQUETTE
#  --------------------------------------------
#  `actions/checkout@v7` est une étiquette MOUVANTE : GitHub la déplace à
#  chaque correctif. C'est le même défaut que `ubuntu-latest`, et le dépôt ne
#  peut pas le reprocher à l'un en le tolérant chez l'autre. Chaque action est
#  donc figée sur un SHA de commit, avec sa version en commentaire — la forme
#  que Dependabot sait mettre à jour.
#
#  Une étiquette peut être reposée sur un autre commit par le propriétaire du
#  dépôt d'action, ou par quelqu'un qui en aurait pris le contrôle. Un SHA,
#  non. Sur un projet réel, c'est la différence entre « on utilise checkout
#  v7 » et « on sait exactement quel code a tourné ».
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Vérification dans le SECI
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          #  git describe a besoin de l'historique complet : config_index.py
          #  s'en sert pour identifier la baseline dans le SCI.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construire le SECI
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          load: true
          tags: do178c-ada:verif
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Identifier l'environnement de production fait partie des données de
      # vie : le journal de la CI doit dire avec quoi le résultat a été
      # obtenu, sans avoir à ouvrir le Dockerfile.
      #
      # Deux niveaux. Ce que l'image CONTIENT est épinglé dans le Dockerfile :
      # image de base, paquets apt, archive d'Alire, chaîne Ada. Ce qui la
      # CONSTRUIT ne l'est pas : l'image du runner ne peut pas
      # l'être, buildx vient d'elle, et BuildKit est tiré par l'étiquette
      # mouvante `moby/buildkit:buildx-stable-1`. Entre le 19 septembre et le
      # 2 octobre 2026, BuildKit est passé de 0.32.2 à 0.33.1 sans que rien
      # ne change ici. Ces versions sont donc TRACÉES, dans ce journal et
      # dans le SECI, plutôt qu'épinglées : figer BuildKit dans ce workflow
      # créerait une version que Dependabot ne suit pas, donc une dette
      # invisible de plus.
      #
      # Une valeur introuvable fait ÉCHOUER l'étape. Le shell par défaut est
      # `bash -e` sans pipefail : sans le test explicite, un format de sortie
      # changé écrirait une valeur vide en silence, et le SECI — donnée CC1
      # pour un logiciel DAL B comme le FQMS — serait incomplet sans le dire.
      - name: Identifier l'environnement
        run: |
          runner="${ImageOS:?ImageOS absent} ${ImageVersion:?ImageVersion absent}"
          buildx=$(docker buildx version)
          buildkit=$(docker buildx inspect | sed -n 's/^BuildKit version: *//p' | head -1)
          if [ -z "$buildx" ] || [ -z "$buildkit" ]; then
            echo "::error::version de buildx ou de BuildKit introuvable"
            exit 1
          fi
          {
            echo "SECI_RUNNER=$runner"
            echo "SECI_BUILDX=$buildx"
            echo "SECI_BUILDKIT=$buildkit"
          } | tee -a "$GITHUB_ENV"
          docker run --rm do178c-ada:verif bash -lc '
            . /etc/os-release && echo "Système    : $PRETTY_NAME $(uname -m)"
            echo "gnatmake   : $(gnatmake --version | head -1)"
            echo "gprbuild   : $(gprbuild --version | head -1)"
            echo "gnatprove  : $(gnatprove --version | head -1)"
            echo "gnatcov    : $(gnatcov --version | head -1)"
            echo "gnatformat : $(gnatformat --version | head -1)"'

      # --user : le dépôt appartient à l'utilisateur du runner (uid 1001) et
      # non à l'utilisateur `ubuntu` de l'image (uid 1000). Sans cette option,
      # gprbuild ne peut pas créer obj/. HOME doit suivre, sinon les outils
      # cherchent un répertoire personnel qui n'existe pas.
      - name: Vérifier — compilation, exécution, preuve, formatage
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            do178c-ada:verif ./scripts/verify.sh

      - name: Mesurer la couverture (statements, décisions, MC/DC)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            do178c-ada:verif ./scripts/coverage.sh

      # Le SCI et le SECI sont des données de vie CC1 au DAL B : ils ne sont pas
      # versionnés — ils sont REGÉNÉRÉS depuis l'état exact du dépôt, sinon
      # ils se périment en silence. fetch-depth: 0 plus haut est nécessaire à
      # `git describe`, dont l'outil se sert pour identifier la baseline.
      - name: Produire le SCI et le SECI
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GITHUB_ACTIONS -e SECI_RUNNER -e SECI_BUILDX -e SECI_BUILDKIT \
            do178c-ada:verif bash -lc '
              git config --global --add safe.directory /workspace
              python3 tools/config_index.py'

      - name: Archiver les données de vie
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: donnees-de-vie
          path: |
            reports/SCI.md
            reports/SECI.md
            reports/tracabilite.csv
          if-no-files-found: ignore
          retention-days: 90

      - name: Archiver les rapports de couverture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapport-couverture
          path: reports/couverture/
          if-no-files-found: ignore
          retention-days: 30
