# =============================================================================
#  Suivi des dépendances de la chaîne de vérification.
#
#  POURQUOI CE FICHIER EXISTE
#  --------------------------
#  Un dépôt qui prêche la gestion de configuration ne peut pas laisser ses
#  propres dépendances vieillir en silence. La première version de ce dépôt
#  utilisait actions/checkout@v4 alors que v7 était sortie : trois majeures de
#  retard, découvertes seulement parce que GitHub a signalé la dépréciation de
#  Node 20. Une mise à jour ponctuelle ne fait que relancer le compteur ; ce
#  qu'il faut, c'est que le retard redevienne VISIBLE.
#
#  Les propositions arrivent en pull request, avec les notes de version. Elles
#  se relisent — on ne fusionne pas une mise à jour de la chaîne de
#  vérification sans regarder ce qui change, pas plus qu'on ne changerait une
#  version dans le Dockerfile sans rejouer la vérification.
#
#  CE QUE DEPENDABOT NE VOIT PAS
#  -----------------------------
#  Les versions épinglées dans .devcontainer/Dockerfile — GNAT, gprbuild,
#  gnatprove, gnatcov, gnatformat — sont des CRATES ALIRE, pas des paquets
#  d'un écosystème que Dependabot connaît. Elles restent donc un point de
#  revue MANUEL, et c'est le vrai risque de dette de ce dépôt. Les revoir en
#  même temps que les propositions ci-dessous :
#
#      alr search gnatprove --full
#
#  Dependabot suit en revanche l'image de base du Dockerfile. Elle y est
#  épinglée par DIGEST, sous son nom de code — `ubuntu:resolute@sha256:…`,
#  c'est-à-dire 26.04 LTS. À chaque passage mensuel, Dependabot propose le
#  digest courant de `resolute` si Canonical a rafraîchi l'image depuis.
#  Chacune de ces propositions change le SECI. Elle ne s'accepte qu'après
#  avoir rejoué toute la vérification, comme un changement de compilateur :
#  c'est le prix de l'épinglage, et c'est ce que doit coûter un changement de
#  SECI.
#
#  La date de l'instantané apt (ARG UBUNTU_SNAPSHOT du Dockerfile) doit
#  avancer avec ce digest, rester postérieure à l'image de base et dans le
#  passé — le Dockerfile refuse une date future : Dependabot ne la voit pas. À chaque proposition de digest, la mettre à
#  jour dans le même commit. De même, ALIRE_SHA256 change avec ALIRE_VERSION.
#
#  Le nom de code règle aussi la question des versions non LTS : `resolute`
#  ne désignera jamais 26.10. Passer à la LTS suivante sera une décision
#  explicite — changer de nom de code — prise après avoir rejoué toute la
#  vérification sur le nouveau socle. 26.04 est maintenue jusqu'en 2031.
# =============================================================================
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "SECI"
